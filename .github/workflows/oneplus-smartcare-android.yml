name: OnePlus SmartCare Android APK
on:
  push:
    paths:
      - 'oneplus-smartcare/android/**'
      - '.github/workflows/oneplus-smartcare-android.yml'
  pull_request:
    paths:
      - 'oneplus-smartcare/android/**'
      - '.github/workflows/oneplus-smartcare-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: oneplus-smartcare/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: oneplus-smartcare-debug-apk
          path: oneplus-smartcare/android/app/build/outputs/apk/debug/app-debug.apk
